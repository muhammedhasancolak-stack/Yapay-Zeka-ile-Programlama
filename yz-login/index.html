<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap</title>
<style>
:root{--bg:#020308;--card:rgba(8,12,26,.74);--line:rgba(70,140,255,.24);--text:#e8eefc;--muted:#8a96b5;
--purple:#2f7bff;--blue:#22d3ee;--err:#ff6b8b;--ok:#4ade80}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);
display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(110px);opacity:.38;z-index:0;pointer-events:none}
body::before{background:var(--purple);top:-18vmax;left:-14vmax}
body::after{background:var(--blue);bottom:-20vmax;right:-14vmax;opacity:.3}
.card{position:relative;z-index:1;width:100%;max-width:420px;padding:40px 32px 32px;background:var(--card);border:1px solid var(--line);
border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
box-shadow:0 0 0 1px rgba(34,211,238,.05),0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(47,123,255,.12)}
h1{font-size:1.9rem;font-weight:700;text-align:center;letter-spacing:.2px;
background:linear-gradient(90deg,#8ab8ff,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.sub{text-align:center;color:var(--muted);font-size:.92rem;line-height:1.5;margin-bottom:26px}
.field{margin-bottom:16px}
.input-wrap{position:relative;display:flex;align-items:center;background:rgba(3,6,16,.85);border:1px solid var(--line);border-radius:12px;
transition:border-color .2s,box-shadow .2s}
.input-wrap:focus-within{border-color:var(--purple);box-shadow:0 0 0 3px rgba(47,123,255,.22),0 0 18px rgba(34,211,238,.18)}
.input-wrap.invalid{border-color:var(--err);box-shadow:0 0 0 3px rgba(255,107,139,.15)}
.input-wrap svg.ico{width:20px;height:20px;margin-left:14px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.input-wrap input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:1rem;padding:15px 14px}
.input-wrap input::placeholder{color:#64708f}
.toggle{background:none;border:0;cursor:pointer;padding:0 14px;height:100%;display:flex;align-items:center;color:var(--muted);transition:color .2s}
.toggle:hover,.toggle:focus-visible{color:var(--blue);outline:0}
.toggle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.error{display:block;min-height:0;font-size:.8rem;color:var(--err);margin:6px 4px 0}
.error:empty{display:none}
.row-end{text-align:right;margin:-4px 0 20px}
a{color:#93c5fd;text-decoration:none;transition:color .2s,text-shadow .2s}
a:hover,a:focus-visible{color:#67e8f9;text-shadow:0 0 10px rgba(34,211,238,.7);outline:0}
.btn{width:100%;border:0;cursor:pointer;color:#fff;font:inherit;font-size:1.02rem;font-weight:600;padding:15px;border-radius:12px;
background:linear-gradient(90deg,#1d4ed8,#0ea5e9);box-shadow:0 0 14px rgba(29,78,216,.45);
transition:transform .2s,box-shadow .25s,filter .25s}
.btn:hover,.btn:focus-visible{outline:0;transform:translateY(-1px);filter:brightness(1.12);
box-shadow:0 0 22px rgba(47,123,255,.85),0 0 46px rgba(34,211,238,.55),0 0 80px rgba(29,78,216,.35)}
.btn:active{transform:translateY(0) scale(.99)}
.foot{text-align:center;color:var(--muted);font-size:.92rem;margin-top:22px}
.foot a{font-weight:600}
.msg{display:none;text-align:center;font-size:.9rem;margin-top:16px;padding:11px 12px;border-radius:10px;
color:var(--ok);background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.35)}
.msg.show{display:block}
@media (max-width:480px){body{padding:14px}.card{padding:32px 20px 26px;border-radius:18px}h1{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="card">
    <h1>Giriş Yap</h1>
    <p class="sub">Hesabına giriş yap.</p>
    <form id="form" novalidate>
      <div class="field">
        <div class="input-wrap"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg><input id="email" name="email" type="email" placeholder="E-posta adresi" autocomplete="email" aria-label="E-posta"></div>
        <span class="error" id="email-err" role="alert"></span>
      </div>
      <div class="field">
        <div class="input-wrap"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" type="password" placeholder="Şifre" autocomplete="current-password" aria-label="Şifre"><button type="button" class="toggle" data-target="password" aria-label="Şifreyi göster"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <span class="error" id="password-err" role="alert"></span>
      </div>
      <div class="row-end"><a href="forgot_password.html">Şifremi unuttum</a></div>
      <button class="btn" type="submit">Giriş Yap</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
    <p class="foot">Hesabın yok mu? <a href="signup.html">Üye Ol</a></p>
  </main>
<script>
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const EYE_OPEN='<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
const EYE_OFF='<path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.6A17 17 0 0 0 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
document.querySelectorAll('.toggle').forEach(function(b){
  b.addEventListener('click',function(){
    var inp=document.getElementById(b.dataset.target);
    var show=inp.type==='password';
    inp.type=show?'text':'password';
    b.querySelector('svg').innerHTML=show?EYE_OFF:EYE_OPEN;
    b.setAttribute('aria-label',show?'Şifreyi gizle':'Şifreyi göster');
  });
});
function setError(id,text){
  var el=document.getElementById(id);
  document.getElementById(id+'-err').textContent=text||'';
  el.closest('.input-wrap').classList.toggle('invalid',!!text);
  return !text;
}
function checkEmail(id){
  var v=document.getElementById(id).value.trim();
  if(!v)return setError(id,'E-posta alanı boş bırakılamaz.');
  if(!EMAIL_RE.test(v))return setError(id,'Geçerli bir e-posta adresi girin (örn. ad@site.com).');
  return setError(id,'');
}
function checkRequired(id,label){
  return setError(id,document.getElementById(id).value.trim()?'':label+' alanı boş bırakılamaz.');
}
function checkPassword(id){
  var v=document.getElementById(id).value;
  if(!v)return setError(id,'Şifre alanı boş bırakılamaz.');
  if(v.length<6)return setError(id,'Şifre en az 6 karakter olmalıdır.');
  return setError(id,'');
}
function showMsg(t){var m=document.getElementById('msg');m.textContent=t;m.classList.add('show');}
document.querySelectorAll('input').forEach(function(i){
  i.addEventListener('input',function(){var w=i.closest('.input-wrap');if(w.classList.contains('invalid'))w.classList.remove('invalid'),document.getElementById(i.id+'-err').textContent='';});
});

document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();
  var a=checkEmail('email'),b=checkPassword('password');
  if(a&&b)showMsg('Giriş bilgileri doğrulandı.');
});
</script>
</body>
</html>
